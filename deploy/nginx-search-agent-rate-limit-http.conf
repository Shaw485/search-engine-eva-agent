# Install as /etc/nginx/conf.d/search-agent-rate-limit.conf.
# This file must be loaded from nginx's http context before the server snippet.

limit_req_zone $binary_remote_addr zone=search_agent_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=search_agent_owner_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=search_agent_public_analysis:10m rate=2r/m;
# A constant server-name key deliberately caps this expensive public route at
# one in-flight request across all clients, not one request per source IP.
limit_conn_zone $server_name zone=search_agent_public_analysis_concurrency:1m;

map $status $search_agent_auth_rate_limited {
    default 0;
    429 1;
}

map $status $search_agent_public_analysis_rejected {
    default 0;
    ~^(400|403|405|409|413|422|429|500|503)$ 1;
}

log_format search_agent_auth_limit escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"status":$status,'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"request_time":$request_time}';

# Rejections only. The format intentionally excludes request bodies, query
# arguments, usernames, cookies and authorization headers.
log_format search_agent_public_analysis_rejection escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"status":$status,'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"request_time":$request_time}';
