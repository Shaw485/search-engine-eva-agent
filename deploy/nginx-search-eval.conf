# Keep human strategy decisions off the public internet. The API also accepts
# decisions only over its direct loopback owner channel.
location = /search-eval-api/agent/strategy/decision {
    access_log off;
    auth_basic off;
    return 404;
}

# The read-only workbench navigation is public. Only the fixed-profile retrieval
# analysis below is also public; every other data-bearing Agent request remains
# behind an exact Owner location.
location = /search-agent.html {
    access_log off;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
}

# The decision UI is static, but every state-changing request below still
# requires Basic Auth plus an application-issued, single-use approval token.
location = /search-owner.html {
    access_log off;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
}

# This fixed static document is an authentication probe only. Nginx validates
# the in-memory Basic credential and never proxies it to the application.
location = /search-agent-auth-check.json {
    limit_req zone=search_agent_login burst=3 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/search-agent-auth-rate-limit.log search_agent_auth_limit if=$search_agent_auth_rate_limited;
    auth_basic "Search Agent Owner";
    error_log /var/log/nginx/search-agent-auth-critical.log crit;
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    error_page 401 =403 /__search-agent-auth-failed;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Suppress the WWW-Authenticate challenge on fetch failures so embedded
# browsers stay on the HTML login form instead of opening a native auth flow.
location = /__search-agent-auth-failed {
    internal;
    access_log off;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    return 403;
}

location = /search-eval-api/agent/strategy/propose {
    limit_req zone=search_agent_owner_api burst=15 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/search-agent-auth-rate-limit.log search_agent_auth_limit if=$search_agent_auth_rate_limited;
    auth_basic "Search Agent Owner";
    error_log /var/log/nginx/search-agent-auth-critical.log crit;
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    error_page 401 =403 /__search-agent-auth-failed;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:8010/agent/strategy/propose;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nginx validates Basic Auth; the application must never receive it.
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# This one fixed-profile analysis route is the only anonymously callable Agent
# compute endpoint. Nginx and the application independently bound abuse: two
# starts/minute per source with one burst, one in-flight request for the whole
# site, a 1 KiB body, one fixed POST contract, and a revision/profile cache.
location = /search-eval-api/agent/retrieval/analyze {
    limit_req zone=search_agent_public_analysis burst=1 nodelay;
    limit_conn search_agent_public_analysis_concurrency 1;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 1k;
    limit_except POST {
        deny all;
    }
    access_log /var/log/nginx/search-agent-public-analysis-rejection.log search_agent_public_analysis_rejection if=$search_agent_public_analysis_rejected;
    auth_basic off;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:8010/agent/retrieval/analyze;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The public request cannot forward credentials or forge an Owner actor.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Search-Owner-Principal "";
    proxy_connect_timeout 3s;
    # The bounded Runtime budget is 120 s; allow the response to reach Nginx
    # without turning a valid 20-Query analysis into a gateway timeout.
    proxy_read_timeout 130s;
}

# The configurable deterministic/LLM Planner is separate from the anonymous
# route so a public request can never spend model quota. Basic Auth terminates
# at Nginx; the provider key remains only in the service environment.
location = /search-eval-api/agent/retrieval/analyze-owner {
    limit_req zone=search_agent_owner_api burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    limit_except POST {
        deny all;
    }
    access_log /var/log/nginx/search-agent-auth-rate-limit.log search_agent_auth_limit if=$search_agent_auth_rate_limited;
    auth_basic "Search Agent Owner";
    error_log /var/log/nginx/search-agent-auth-critical.log crit;
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    error_page 401 =403 /__search-agent-auth-failed;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:8010/agent/retrieval/analyze-owner;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 130s;
}

