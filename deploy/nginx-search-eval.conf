# Keep human strategy decisions off the public internet. The API also accepts
# decisions only over its direct loopback owner channel.
location = /search-eval-api/agent/strategy/decision {
    access_log off;
    auth_basic off;
    return 404;
}

# Keep the search experience and strategy catalog public. Only the standalone
# Agent workbench page and the proposal-generating endpoint require owner login.
location = /search-agent.html {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /search-eval-api/agent/strategy/propose {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;

    proxy_pass http://127.0.0.1:8010/agent/strategy/propose;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nginx validates Basic Auth; the application must never receive it.
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Stage-aware retrieval analysis returns private Query-level experiment evidence
# and performs bounded server work, so it uses the same Owner gate as proposal
# generation. The application never receives the Basic Auth header.
location = /search-eval-api/agent/retrieval/analyze {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;

    proxy_pass http://127.0.0.1:8010/agent/retrieval/analyze;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    # The bounded Runtime budget is 120 s; allow the response to reach Nginx
    # without turning a valid 20-Query analysis into a gateway timeout.
    proxy_read_timeout 130s;
}

# Agent Eval executes the fixed 12-task suite and exposes only aggregate
# evidence. It is owner-only and may take as long as the retrieval analysis.
location = /search-eval-api/agent/eval/run {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;

    proxy_pass http://127.0.0.1:8010/agent/eval/run;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 130s;
}

# The Query constructor is also owner-only. Its request contract fixes the
# source to committed smoke data; raw Query text stays in server-side artifacts.
location = /search-eval-api/agent/query-constructor/build {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;

    proxy_pass http://127.0.0.1:8010/agent/query-constructor/build;
