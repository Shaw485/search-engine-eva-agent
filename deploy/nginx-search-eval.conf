    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Search-Owner-Principal $remote_user;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Unknown future Agent routes must never inherit the public API proxy by
# accident. Exact locations above take precedence over this prefix.
location ^~ /search-eval-api/agent/ {
    access_log off;
    auth_basic off;
    return 404;
}

location = /search-eval-api/agent {
    access_log off;
    auth_basic off;
    return 404;
}

# Add these location blocks inside the shawspace.cn HTTPS server block. The
# trailing slashes on both location and proxy_pass are intentional.
location /search-eval-api/ {
    # The default combined log includes $request. Keep it disabled even though
    # the preferred POST endpoint keeps Query text in the body; a deprecated
    # GET compatibility endpoint still exists for the current prototype UI.
    access_log off;
    auth_basic off;
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
