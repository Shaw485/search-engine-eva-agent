    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Bad Case diagnostics runs the fixed 59-Query development batch and returns a
# strictly limited raw sample for the owner workbench. Keep both the endpoint
# and all access-log request metadata behind the same Owner gate.
location = /search-eval-api/agent/bad-cases/run {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:8010/agent/bad-cases/run;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    # The worker enforces a 125 s wall deadline plus bounded TERM/KILL grace.
    # Keep the proxy alive long enough to return the worker's terminal state.
    proxy_read_timeout 140s;
}

# Planning is read-only but reveals private diagnostic IDs and counts. Keep it
# behind the same Owner gate; the endpoint accepts IDs, never filesystem paths.
location = /search-eval-api/agent/diagnostic-experiments/plan {
    access_log off;
    auth_basic "Search Agent";
    auth_basic_user_file /etc/nginx/.search-agent.htpasswd;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:8010/agent/diagnostic-experiments/plan;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

