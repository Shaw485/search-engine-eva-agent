name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage-0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Repository policy
        run: python scripts/check_repository_policy.py
      - name: Test
        run: python -m pytest
      - name: Deterministic smoke
        run: python -m search_quality.smoke --backend local --query "wireless mouse" --top-k 3
