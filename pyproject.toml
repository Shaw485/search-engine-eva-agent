[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "search-engine-eva-agent"
version = "0.1.0"
description = "Evidence-driven evaluation and diagnosis agent for e-commerce search ranking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "polars>=1.33,<2",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
search-quality-smoke = "search_quality.smoke:main"
search-quality-agent = "search_quality.agent.cli:main"
search-quality-agent-replay = "search_quality.agent.replay_cli:main"
search-quality-agent-eval = "search_quality.agent_eval.cli:main"
search-quality-query-constructor = "search_quality.query_constructor.cli:main"
search-quality-bad-cases = "search_quality.bad_cases.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data/esci-data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
